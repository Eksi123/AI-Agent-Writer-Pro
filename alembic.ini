# Alembic configuration.
# NOTE: keep this file ASCII-only. Alembic reads it with encoding="locale"
# (GBK on Chinese Windows), so non-ASCII comments raise UnicodeDecodeError.
#
# `sqlalchemy.url` is injected at runtime by src/app/db/migrations/env.py from
# app.core.config (data/app.db); do not hardcode it here.
# Normal usage: `uv run writer migrate` (wraps `alembic upgrade head`).

[alembic]
script_location = src/app/db/migrations
prepend_sys_path = src
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
