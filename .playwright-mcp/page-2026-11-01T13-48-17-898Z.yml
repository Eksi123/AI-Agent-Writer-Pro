          - generic [ref=e164]: 2026-11-01 18:54
        - generic [ref=e166]:
          - generic [ref=e167]: "@@ lines 1-57 of 57 @@ --- created_at: '2026-11-01T03:10:41.795Z' last_writer: manual sort_order: 1 status: draft title: 高铁 updated_at: '2026-11-01T10:55:22.434Z' version: 4 volume_id: 703b9805 word_count: 7 --- 林昭是被刹车声惊醒的。 不是正常的减速——那种从匀速到静止的平滑过渡，他在无数次出差途中早已习惯。这一次，金属的尖啸从列车底部直穿上来，像有人拿一把钝刀，沿着他的脊椎一路往上划。小桌板上的纸杯弹了起来，可乐洒了半桌。 车厢里的灯灭了半秒，又亮了，变成了昏暗的应急黄。 他抬头看了一眼座位上方的信息屏。出发时还显示着「G6014 · 下一站：星城」的屏幕，此刻只剩下一个不断旋转的加载圆圈。空调的出风口不再吹风，安静下来的车厢里，只剩下轮轨摩擦发出的低哑嗡鸣，正在一点点减弱。 \"怎么回事？\"斜对面穿制服的中年男人探出身子，试图往过道方向看。 没有人回答。 林昭摘下还挂在耳朵上的降噪耳机——他本来是靠着它才睡着的。耳机一离耳朵，车厢里的声音一下子涌进来了：有人在低声打电话，有小孩在哭，有人用力拍座椅扶手，还有前方传来的脚步声，很快很急，皮鞋底敲在地板上，像一串不规则的鼓点。 他掏出手机。屏幕右上角的信号格从满格降到了一格，然后又降到零。他试着刷了一下信息流，转了三圈，弹出一行灰色小字：网络连接失败。 时间显示19:47。 他转头看向车窗外。 列车正在穿过一段山间的路段——上车后他记得看过线路图，这一段有连续的隧道群。但此刻窗外并不是隧道里那种被灯光照亮的灰色墙面。窗外是黑的。彻底的、没有层次的黑，像是有人用墨汁把整个世界涂满了。列车明明还在滑行，窗外却连一丝光影的流动都看不到——没有远处城市的灯火，没有对面驶来列车的大灯，连隧壁上那些每隔几米就有的检修灯都灭了。 这种黑的密度让他产生了一种荒谬的感觉：不是外面的灯灭了，而是外面的世界不在了。 车厢前门被人从外面推开了。一股气味冲进来——不是车厢里常见的方便面混着香水的那种味道。那是一种潮湿的、发苦的、像是把树叶和铁锈泡在一起的气味，从门缝里灌进来，贴着地板往前蔓延。 \"各位旅客，\"广播终于响了，但那个甜美的标准女声此刻听上去断断续续，像是被什么东西干扰了一样，\"本次列车……因特殊情况……临时停车——\" 广播在一声刺耳的电流啸叫后彻底断了。 穿制服的中年男人已经站到了过道上，手里攥着手机，屏幕的微光照亮了他额头的汗。车厢里此起彼伏地响起手机点亮的声音，几十块小屏幕在黑暗中浮动，像一群迷路的萤火虫。 \"谁去按那个紧急呼叫？\"有人喊。 没有人动。 林昭低头看了一眼自己桌上的手机。信号仍然是零。他犹豫了一下，还是把它翻了个面扣在桌上，然后站起来，把背包从行李架上拽下来，拉上外套拉链。 他说不清楚为什么要这样做。但他闻着那股从门口涌进来的苦涩气味，感到自己的皮肤上起了一层细密的鸡皮疙瘩。 直觉告诉他：不要在这里等。 他迈出了一步。车厢又晃了一下——不是刹车，而是某种更轻微的、像是从地底深处传来的震颤。 窗外的黑暗里，似乎有什么东西动了一下。"
