[project]
name = "ai-agent-writer-pro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "xionggaoqing", email = "1971354320@.qqcom" }
]
requires-python = ">=3.12"
dependencies = [
    # ---- Web / API ----
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # ---- DB / 迁移 ----
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    # ---- 文件 / 模板 / 日志 ----
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "jinja2>=3.1",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "tiktoken>=0.7",
    # ---- Agent（deepagents 及其生态）----
    "deepagents==0.7.23",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-openai==1.5.1",
    "langchain-anthropic>=1.0",
    "langchain-google-genai>=4.4",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-mcp-adapters>=0.1",
    "mcp>=2.0",
    # ---- 可观测（v5，OTel 版）----
    "langfuse>=5.0,<6.0",
    # ---- 保留但不使用（见手册「八、⑤」）----
    "claude-agent-sdk==0.2.165",
    "lmnr>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
writer = "app.cli:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

# `src/app` 中的 `app` 是合法包名，只需显式声明模块位置（见手册「八、③」）
[tool.uv.build-backend]
module-root = "src"
module-name = "app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# UP009 豁免：项目统一保留 `# -*- coding: utf-8 -*-` 文件头（作者规范），
# 虽然 Python 3 默认 UTF-8 使该声明冗余，但为风格一致刻意保留。
ignore = ["E501", "B008", "UP009"]
